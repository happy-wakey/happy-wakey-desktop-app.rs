[identity]
service = "happy-wakey-desktop-app"
type_name = "DesktopEnv"

[help]
url = "https://github.com/happy-wakey/happy-wakey-desktop-app.rs"

[parse]
allow_unknown = false
unknown_options_env = "HAPPY_WAKEY_UNKNOWN_OPTIONS"
errors_env = "HAPPY_WAKEY_FLAG_ERRORS"

[env]
ignore = [
  "FLAGS2ENV_CONFIG",
  "SUPABASE_ANON_KEY",
  "OPENWEATHER_API_KEY",
  "OPEN_METEO_API_KEY",
  "FINNHUB_API_KEY",
  "NEWSAPI_KEY",
  "HAPPY_WAKEY_ACCESS_TOKEN",
  "HAPPY_WAKEY_BUNDLE_ID"
]

[flags.supabase_url]
env = "SUPABASE_URL"
aliases = ["supabase-url"]
short = "s"
type = "string"
default = "https://vgzyyfhnendriyrhakkp.supabase.co"

[flags.open_meteo_base_url]
env = "OPEN_METEO_BASE_URL"
aliases = ["open-meteo-base-url"]
type = "string"
default = "https://api.open-meteo.com/v1/forecast"

[flags.git_repo_path]
env = "GIT_REPO_PATH"
aliases = ["git-repo", "git-repo-path"]
type = "string"

[flags.config_dir]
env = "CONFIG_DIR"
aliases = ["config-dir"]
type = "string"

[flags.platform_url]
env = "HAPPY_WAKEY_PLATFORM_URL"
aliases = ["platform-url"]
type = "string"
default = "https://98.90.186.114"

[flags.shared_auth_url]
env = "HAPPY_WAKEY_SHARED_AUTH_URL"
aliases = ["shared-auth-url"]
type = "string"

[flags.gateway_url]
env = "HAPPY_WAKEY_GATEWAY_URL"
aliases = ["happy-wakey-gateway-url"]
type = "string"


[flags.finnhub-api-key]
env = "FINNHUB_API_KEY"
long = "finnhub-api-key"
type = "string"
help = "Runtime environment key FINNHUB_API_KEY."

[flags.flags2env-config]
env = "FLAGS2ENV_CONFIG"
long = "flags2env-config"
type = "string"
help = "Runtime environment key FLAGS2ENV_CONFIG."

[flags.happy-wakey-bundle-id]
env = "HAPPY_WAKEY_BUNDLE_ID"
long = "happy-wakey-bundle-id"
type = "string"
help = "Runtime environment key HAPPY_WAKEY_BUNDLE_ID."

[flags.happy-wakey-oauth-port]
env = "HAPPY_WAKEY_OAUTH_PORT"
long = "happy-wakey-oauth-port"
type = "string"
help = "Runtime environment key HAPPY_WAKEY_OAUTH_PORT."

[flags.newsapi-key]
env = "NEWSAPI_KEY"
long = "newsapi-key"
type = "string"
help = "Runtime environment key NEWSAPI_KEY."

[flags.openweather-api-key]
env = "OPENWEATHER_API_KEY"
long = "openweather-api-key"
type = "string"
help = "Runtime environment key OPENWEATHER_API_KEY."

[flags.open-meteo-api-key]
env = "OPEN_METEO_API_KEY"
long = "open-meteo-api-key"
type = "string"
help = "Runtime environment key OPEN_METEO_API_KEY."

[flags.supabase-anon-key]
env = "SUPABASE_ANON_KEY"
long = "supabase-anon-key"
type = "string"
help = "Runtime environment key SUPABASE_ANON_KEY."
